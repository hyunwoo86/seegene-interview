<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1690" viewBox="0 0 1400 1690" role="img" aria-labelledby="title desc">
<title id="title">dRAST 검사 흐름도</title><desc id="desc">검사 등록, 분주, 배양, 촬영과 분석 반복, 결과 저장과 배출. 실행 조건, 오류 분기와 저장소 역할을 함께 표시한 설명용 개념도.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#456480"/></marker></defs>
<style>text{font-family:'Malgun Gothic',sans-serif;fill:#16324f;font-size:23px}.head{font-weight:700;font-size:26px}.small{font-size:20px;fill:#53677b}.label{font-size:21px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.line{fill:none;stroke:#456480;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1400" height="1690" fill="#fff"/>
<text x="60" y="60" style="font-size:38px;font-weight:700">dRAST · 검사 흐름도</text>
<text x="60" y="100" class="small">면접 화이트보드용 개념도 · 실제 코드의 모든 상태·예외를 나타내지는 않음</text>
<rect x="250" y="135" width="480" height="100" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="170" text-anchor="middle" class="head">1  시작·초기화</text>
<text x="490.0" y="204" text-anchor="middle" class="small">설정 로드 · 연결 · 모듈 상태 확인</text>
<rect x="250" y="275" width="480" height="100" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="310" text-anchor="middle" class="head">2  검사 등록  |  Regist</text>
<text x="490.0" y="344" text-anchor="middle" class="small">검체·키트·슬롯 확인 → 작업 큐</text>
<rect x="250" y="415" width="480" height="110" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="450" text-anchor="middle" class="head">3  분주  |  OnGoing</text>
<text x="490.0" y="484" text-anchor="middle" class="small">선행 조건·장비 자원 확인</text>
<text x="490.0" y="516" text-anchor="middle" class="small">TCP 명령 → 실제 완료 확인</text>
<rect x="250" y="580" width="480" height="100" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="615" text-anchor="middle" class="head">4  배양·촬영 시점 대기</text>
<text x="490.0" y="649" text-anchor="middle" class="small">경과시간 관리 · 다음 촬영 예약</text>
<rect x="250" y="745" width="480" height="120" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="780" text-anchor="middle" class="head">5  촬영</text>
<text x="490.0" y="814" text-anchor="middle" class="small">카메라·위치 선택 → Focus mark</text>
<text x="490.0" y="846" text-anchor="middle" class="small">초점 조정 → 영상 획득·저장</text>
<rect x="250" y="925" width="480" height="100" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="960" text-anchor="middle" class="head">6  외부 영상분석</text>
<text x="490.0" y="994" text-anchor="middle" class="small">ImageProc.exe 실행 → 결과 수신</text>
<path d="M490 1060.0L725.0 1130L490 1200.0L255.0 1130Z" fill="#fff5df" stroke="#bd913a" stroke-width="2"/>
<text x="490" y="1123" text-anchor="middle" class="">최종 판정에 필요한</text>
<text x="490" y="1155" text-anchor="middle" class="">조건을 충족했는가?</text>
<rect x="250" y="1260" width="480" height="100" rx="16" fill="#e9f7f2" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="1295" text-anchor="middle" class="head">7  결과·이력 저장  |  Complete</text>
<text x="490.0" y="1329" text-anchor="middle" class="small">최종 결과 반영 · 화면 표시</text>
<rect x="250" y="1410" width="480" height="90" rx="16" fill="#e9f7f2" stroke="#a8bdce" stroke-width="2"/>
<text x="490.0" y="1445" text-anchor="middle" class="head">8  검체 배출  |  Eject</text>
<path d="M490 235V275" class="line"/>
<path d="M490 375V415" class="line"/>
<path d="M490 525V580" class="line"/>
<path d="M490 680V745" class="line"/>
<path d="M490 865V925" class="line"/>
<path d="M490 1025V1060" class="line"/>
<path d="M490 1200V1260" class="line"/>
<text x="520" y="1236" text-anchor="middle" class="label">예</text>
<path d="M490 1360V1410" class="line"/>
<path d="M255 1130H100V630H250" class="line"/>
<text x="150" y="1090" text-anchor="middle" class="label">아니오 · 다음 측정</text>
<text x="165" y="810" text-anchor="middle" class="small">배양</text>
<text x="165" y="842" text-anchor="middle" class="small">촬영</text>
<text x="165" y="874" text-anchor="middle" class="small">분석</text>
<text x="165" y="906" text-anchor="middle" class="small">반복</text>
<rect x="920" y="135" width="420" height="160" rx="16" fill="#f3f6fa" stroke="#a8bdce" stroke-width="2"/>
<text x="1130.0" y="170" text-anchor="middle" class="head">저장소 역할</text>
<text x="1130.0" y="204" text-anchor="middle" class="small">SQLite · 검사 기록 / 설정</text>
<text x="1130.0" y="236" text-anchor="middle" class="small">JSON · 모션 파라미터</text>
<text x="1130.0" y="268" text-anchor="middle" class="small">영상 폴더 · 원본 영상</text>
<text x="1130" y="331" text-anchor="middle" class="small">명령·응답·오류 → 로그 파일</text>
<text x="1130" y="366" text-anchor="middle" class="small">실제 테이블·갱신 시점은 별도 확인</text>
<path d="M920 185H730" class="line" stroke-dasharray="8 7"/>
<text x="825" y="165" text-anchor="middle" class="label">설정 읽기</text>
<path d="M730 805H825V260H920" class="line" stroke-dasharray="8 7"/>
<text x="827" y="785" text-anchor="middle" class="label">영상 저장</text>
<path d="M730 1310H865V285H920" class="line" stroke-dasharray="8 7"/>
<text x="808" y="1347" text-anchor="middle" class="small">결과·이력 기록</text>
<rect x="930" y="430" width="400" height="95" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="1130.0" y="465" text-anchor="middle" class="head">각 장비 작업의 실행 조건</text>
<text x="1130.0" y="499" text-anchor="middle" class="small">예약 시간 · 선행 단계 · 자원</text>
<path d="M1130 555.0L1320.0 625L1130 695.0L940.0 625Z" fill="#fff5df" stroke="#bd913a" stroke-width="2"/>
<text x="1130" y="618" text-anchor="middle" class="">지금 실행</text>
<text x="1130" y="650" text-anchor="middle" class="">가능한가?</text>
<path d="M1130 525V555" class="line"/>
<rect x="960" y="745" width="340" height="100" rx="16" fill="#eaf3ff" stroke="#a8bdce" stroke-width="2"/>
<text x="1130.0" y="780" text-anchor="middle" class="head">자원 예약·명령 실행</text>
<text x="1130.0" y="814" text-anchor="middle" class="small">ACK ≠ 물리 동작 완료</text>
<path d="M1130 695V745" class="line"/>
<text x="1160" y="727" text-anchor="middle" class="label">예</text>
<path d="M1320 625H1370V478H1330" class="line"/>
<text x="1328" y="609" text-anchor="middle" class="label">아니오</text>
<text x="1140" y="408" text-anchor="middle" class="small">공유 자원 사용 중이면 대기 후 재확인</text>
<text x="1130" y="890" text-anchor="middle" class="small">분주·촬영 등 장비 작업에 적용</text>
<rect x="940" y="980" width="390" height="220" rx="16" fill="#fff0ee" stroke="#a8bdce" stroke-width="2"/>
<text x="1135.0" y="1015" text-anchor="middle" class="head">오류 / 결과 불명확</text>
<text x="1135.0" y="1049" text-anchor="middle" class="small">통신·장비·분석 오류 감지</text>
<text x="1135.0" y="1081" text-anchor="middle" class="small">기록 · 영향 범위 확인</text>
<text x="1135.0" y="1113" text-anchor="middle" class="small">오류 유형별 대기 / 중단 처리</text>
<text x="1135.0" y="1145" text-anchor="middle" class="small">재개 조건은 실제 구현 확인</text>
<path d="M730 975H940" class="line" stroke-dasharray="8 7"/>
<text x="832" y="951" text-anchor="middle" class="label">오류 분기 예</text>
<text x="1135" y="1245" text-anchor="middle" class="small">무조건 재전송·자동 재개로</text>
<text x="1135" y="1277" text-anchor="middle" class="small">연결하지 않는다</text>
<rect x="60" y="1550" width="1280" height="100" rx="12" fill="#f3f6fa"/>
<text x="85" y="1586" text-anchor="start" class="small">실선 = 정상 검사·판단 흐름    점선 = 데이터 연결 또는 대표 오류 분기</text>
<text x="85" y="1624" text-anchor="start" class="small">본인: 앱·검사 순서·TCP·촬영 연동    /    외주: HW 미들웨어    /    분석팀: AI 알고리즘</text>
</svg>
